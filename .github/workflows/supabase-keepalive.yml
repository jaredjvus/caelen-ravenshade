name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'  # daily at noon UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://amnfbhhmwhsythzkvcra.supabase.co/rest/v1/character_sheets?select=id&limit=1" \
            -H "apikey: sb_publishable_f4f6TevmVgjSLw07PuJLgQ_ED8xhitb" \
            -H "Authorization: Bearer sb_publishable_f4f6TevmVgjSLw07PuJLgQ_ED8xhitb")
          echo "Supabase responded: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
